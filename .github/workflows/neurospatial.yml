name: NeuroSpatial optional inverse research
on:
  push:
    paths:
      - 'src/neuroshield/neurospatial/**'
      - 'tests/test_neurospatial.py'
      - 'pyproject.toml'
      - '.github/workflows/neurospatial.yml'
  pull_request:
    paths:
      - 'src/neuroshield/neurospatial/**'
      - 'tests/test_neurospatial.py'
      - 'pyproject.toml'
      - '.github/workflows/neurospatial.yml'
jobs:
  inverse-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[neurospatial]"
      - run: python -m unittest discover -s tests -p test_neurospatial.py -v
      - run: python -m neuroshield.neurospatial --out synthetic-inverse-report.json
