name: Research prototype checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m neuroshield knowledge audit --root .
      - run: python -m neuroshield corpora audit --root .
      - run: python -m neuroshield corpora bench --root . --out ../corpora-benchmark.json
      - run: python -m neuroshield corpora stage --root . --out ../neuroshield-corpora-staged
      - run: python -m neuroshield knowledge stage --root . --out ../neuroshield-committed-corpus
      - run: python -m neuroshield knowledge bench --root . --stage ../neuroshield-committed-corpus --out ../navigation-benchmark.json
      - run: python -m neuroshield export --scenario oblique --out sample-output.json
      - run: python -m neuroshield qualify-independent --scenario all --out numerical-audit.json
      - run: python -m neuroshield export-audit-trace --scenario oblique --out trace-audit-SYNTHETIC.json
      - run: python -m neuroshield validate-headform examples/headform-SYNTHETIC-manifest.json examples/headform-SYNTHETIC.csv
      - run: python -m neuroshield inspect-bench-intake examples/bench-reference-SYNTHETIC-profile.json examples/bench-reference-SYNTHETIC-manifest.json examples/bench-reference-SYNTHETIC.csv
      - run: python -m neuroshield compare-bench-pair examples/bench-reference-SYNTHETIC-profile.json examples/bench-reference-SYNTHETIC-manifest.json examples/bench-reference-SYNTHETIC.csv examples/bench-candidate-SYNTHETIC-profile.json examples/bench-candidate-SYNTHETIC-manifest.json examples/bench-candidate-SYNTHETIC.csv --out ../paired-bench-SYNTHETIC.json
      - run: python -m neuroshield compare-bench-waveforms examples/paired-waveform-plan-SYNTHETIC.json examples/bench-reference-SYNTHETIC-profile.json examples/bench-reference-SYNTHETIC-manifest.json examples/bench-reference-SYNTHETIC.csv examples/bench-candidate-SYNTHETIC-profile.json examples/bench-candidate-SYNTHETIC-manifest.json examples/bench-candidate-SYNTHETIC.csv --out ../paired-waveforms-SYNTHETIC.json
      - run: python -m neuroshield model-measurement-gate --out ../model-validation-BLOCKED.json
      - run: python -m neuroshield.frame_projection examples/frame-projection-plan-SYNTHETIC.json examples/bench-reference-SYNTHETIC-profile.json examples/bench-reference-SYNTHETIC-manifest.json examples/bench-reference-SYNTHETIC.csv --expected-plan-sha256 440182752f4b1c75a3dd47d878e73826bcf697339cfa19663c5eba642f4260d3 --out ../frame-projection-SYNTHETIC.json
      - run: python -m neuroshield.agent_protocol capabilities
      - run: python -m neuroshield.agent_protocol schema
      - run: python -m neuroshield.agent_protocol validate examples/agent-task-SYNTHETIC.json
      - run: python -m neuroshield.agent_protocol run examples/agent-task-SYNTHETIC.json --out ../agent-run-smoke
      - run: python -m neuroshield.agent_protocol verify ../agent-run-smoke
