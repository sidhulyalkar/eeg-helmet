[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroshield-research"
version = "0.3.0"
description = "Open, non-clinical research workbench for helmet impact biomechanics and synthetic neural signals"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "NeuroShield contributors"}]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering"]
dependencies = []

[project.scripts]
neuroshield = "neuroshield.__main__:main"

[tool.setuptools.package-data]
neuroshield = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
